name: Release

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag or version name to publish (e.g. 1.0.0)'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-linux:
    name: Linux (AppImage)
    runs-on: ubuntu-24.04
    
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build extra-cmake-modules pkg-config ccache \
            libgl1-mesa-dev libfuse2 libxkbcommon-dev libxkbcommon-x11-0 libxcb-cursor-dev \
            libxcb-xinerama0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-sync1 libxcb-xfixes0 libxcb-glx0

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: release-linux
          max-size: 2G

      - name: Install Qt 6.8
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          modules: 'qtimageformats qtnetworkauth'
          cache: true
          install-deps: false

      - name: Cache vcpkg archives
        uses: actions/cache@v6
        with:
          path: ~/.cache/vcpkg/archives
          key: ${{ runner.os }}-vcpkg-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-

      - name: Bootstrap vcpkg
        run: |
          chmod +x cmake/vcpkg/bootstrap-vcpkg.sh
          ./cmake/vcpkg/bootstrap-vcpkg.sh -disableMetrics
          echo "VCPKG_ROOT=${{ github.workspace }}/cmake/vcpkg" >> $GITHUB_ENV

      - name: Build
        run: |
          cmake --preset linux \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_MAKE_PROGRAM=ninja \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DENABLE_LTO=ON \
            -DBUILD_TESTING=OFF \
            -Wno-dev
          cmake --build --preset linux --config Release --parallel

      - name: Install
        run: DESTDIR=$(pwd)/AppDir cmake --install build --config Release

      - name: Package AppImage
        run: |
          VERSION="${{ inputs.tag_name || github.ref_name }}"
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage -O linuxdeploy
          chmod +x linuxdeploy
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage -O linuxdeploy-plugin-qt
          chmod +x linuxdeploy-plugin-qt
          
          export LD_LIBRARY_PATH=$QT_ROOT_DIR/lib:$LD_LIBRARY_PATH
          export QMAKE=$QT_ROOT_DIR/bin/qmake
          
          export LDAI_OUTPUT="Prisma-Linux-${VERSION}-x86_64.AppImage"
          
          ./linuxdeploy --appdir AppDir \
            --executable AppDir/usr/bin/prismlauncher \
            --desktop-file AppDir/usr/share/applications/org.prismlauncher.PrismLauncher.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/256x256/apps/org.prismlauncher.PrismLauncher_256.png \
            --plugin qt \
            --output appimage

      - name: Upload
        uses: actions/upload-artifact@v6
        with:
          name: linux
          path: '*.AppImage'

  build-macos:
    name: macOS (DMG)
    runs-on: macos-14
    
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install dependencies
        run: brew install cmake ninja extra-cmake-modules ccache

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: release-macos
          max-size: 2G

      - name: Install Qt 6.8
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          modules: 'qtimageformats qtnetworkauth'
          cache: true

      - name: Cache vcpkg archives
        uses: actions/cache@v6
        with:
          path: ~/.cache/vcpkg/archives
          key: ${{ runner.os }}-vcpkg-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-

      - name: Bootstrap vcpkg
        run: |
          chmod +x cmake/vcpkg/bootstrap-vcpkg.sh
          ./cmake/vcpkg/bootstrap-vcpkg.sh -disableMetrics
          echo "VCPKG_ROOT=${{ github.workspace }}/cmake/vcpkg" >> $GITHUB_ENV

      - name: Build
        run: |
          cmake --preset macos_universal \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_MAKE_PROGRAM=ninja \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 \
            -DBUILD_TESTING=OFF \
            -Wno-dev
          cmake --build --preset macos_universal --config Release --parallel

      - name: Install
        run: cmake --install build --config Release --prefix install

      - name: Package DMG
        run: |
          VERSION="${{ inputs.tag_name || github.ref_name }}"
          APP_DIR=""
          if [ -d "install/Prisma.app" ]; then
            APP_DIR="install/Prisma.app"
          elif [ -d "install/prismlauncher.app" ]; then
            APP_DIR="install/prismlauncher.app"
          elif [ -d "build/Prisma.app" ]; then
            APP_DIR="build/Prisma.app"
          else
            APP_DIR=$(find build install -maxdepth 2 -name "*.app" -type d | head -n 1)
          fi

          test -n "$APP_DIR" && test -d "$APP_DIR" || { echo "ERROR: .app bundle not found!"; exit 1; }

          mkdir -p dmg_root
          cp -R "$APP_DIR" dmg_root/Prisma.app
          ln -s /Applications dmg_root/Applications
          hdiutil create -volname "Prisma" -srcfolder dmg_root -ov -format UDZO "Prisma-macOS-${VERSION}.dmg"

      - name: Upload
        uses: actions/upload-artifact@v6
        with:
          name: macos
          path: '*.dmg'

  build-windows:
    name: Windows (Portable ZIP)
    runs-on: windows-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          path-type: full
          update: true
          install: |
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-extra-cmake-modules
            mingw-w64-clang-x86_64-pkgconf
            mingw-w64-clang-x86_64-qt6-base
            mingw-w64-clang-x86_64-qt6-imageformats
            mingw-w64-clang-x86_64-qt6-svg
            mingw-w64-clang-x86_64-qt6-networkauth
            mingw-w64-clang-x86_64-libarchive
            mingw-w64-clang-x86_64-zlib
            mingw-w64-clang-x86_64-cmark
            mingw-w64-clang-x86_64-qt6-tools
            mingw-w64-clang-x86_64-qt6-translations
            mingw-w64-clang-x86_64-qrencode
            mingw-w64-clang-x86_64-tomlplusplus

      - name: Build
        shell: msys2 {0}
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/clang64 \
            -DCMAKE_PREFIX_PATH=/clang64 \
            -DENABLE_LTO=ON \
            -DBUILD_TESTING=OFF \
            -DLauncher_QT_VERSION_MAJOR=6 \
            -Wno-dev
          cmake --build build --config Release --parallel

      - name: Stage files for portable package
        shell: msys2 {0}
        run: |
          STAGE="$(pwd)/stage"
          mkdir -p "$STAGE"

          # Binaries
          if [ -f "build/prismlauncher.exe" ]; then
            cp build/prismlauncher*.exe "$STAGE/"
          elif [ -f "build/launcher/prismlauncher.exe" ]; then
            cp build/launcher/prismlauncher*.exe "$STAGE/"
          else
            find build -maxdepth 2 -type f -name "prismlauncher*.exe" -exec cp {} "$STAGE/" \;
          fi
          test -f "$STAGE/prismlauncher.exe" || { echo "ERROR: prismlauncher.exe not found!"; exit 1; }

          # Qt DLLs
          for dll in \
            Qt6Core Qt6Gui Qt6Widgets Qt6Network Qt6Concurrent Qt6Xml \
            Qt6NetworkAuth Qt6OpenGL Qt6Svg Qt6DBus Qt6Test \
            libpng16-16 libjpeg-8 libharfbuzz-0 libpcre2-16-0 \
            libfreetype-6 libbz2-1 libintl-8 libiconv-2 libpcre2-8-0 \
            libgraphite2 libbrotlidec libbrotlicommon \
            libpng16 libpng16-16 libcrypto-3 libssl-3 \
            libzstd libdouble-conversion libicuuc78 libicuin78 libicudt78 \
            zlib1 libzstd.dll libwinpthread-1 libgcc_s_seh-1 libstdc++-6 libc++abi \
            libunwind libclang_rt; do
            find /clang64/bin -maxdepth 1 -name "${dll}*.dll" -exec cp {} "$STAGE/" \; 2>/dev/null || true
          done

          # Broader: copy ALL dlls from /clang64/bin
          cp /clang64/bin/*.dll "$STAGE/" 2>/dev/null || true

          # Qt plugins (copy to both root and plugins/ for maximum compatibility)
          mkdir -p "$STAGE/plugins"
          for plugin in iconengines imageformats platforms styles tls; do
            if [ -d "/clang64/share/qt6/plugins/$plugin" ]; then
              cp -r "/clang64/share/qt6/plugins/$plugin" "$STAGE/$plugin"
              cp -r "/clang64/share/qt6/plugins/$plugin" "$STAGE/plugins/$plugin"
            fi
          done

          # Qt translations
          mkdir -p "$STAGE/translations"
          cp -r /clang64/share/qt6/translations/* "$STAGE/translations/" 2>/dev/null || true

          # Java launcher jars
          mkdir -p "$STAGE/jars"
          cp build/jars/*.jar "$STAGE/jars/" 2>/dev/null || true
          cp -r install/share/prismlauncher/jars/* "$STAGE/jars/" 2>/dev/null || true

          # Config files
          cat > "$STAGE/qt.conf" << 'EOF'
[Paths]
Prefix = .
Plugins = plugins
EOF
          cp launcher/qtlogging.ini "$STAGE/" 2>/dev/null || true

          # Portable mode marker
          cp "${{ github.workspace }}/program_info/portable.txt" "$STAGE/"

          # List what we staged
          echo "=== Staged files ==="
          ls -la "$STAGE/"
          echo "=== DLL count ==="
          ls "$STAGE/"*.dll 2>/dev/null | wc -l

      - name: Package Portable ZIP
        shell: msys2 {0}
        run: |
          VERSION="${{ inputs.tag_name || github.ref_name }}"
          cd stage
          7z a -tzip "${{ github.workspace }}/Prisma-Windows-Portable-${VERSION}.zip" *

      - name: Upload
        uses: actions/upload-artifact@v6
        with:
          name: windows
          path: Prisma-Windows-Portable-*.zip

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-linux, build-macos, build-windows]
    permissions:
      contents: write
    
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          name: Prisma ${{ inputs.tag_name || github.ref_name }}
          body: |
            ## Prisma ${{ inputs.tag_name || github.ref_name }}
            
            Fork de [PrismLauncher](https://github.com/PrismLauncher/PrismLauncher) con soporte para cuentas online y offline.
            
            ### Descargas
            - **Linux**: AppImage (x86_64)
            - **macOS**: DMG (Universal)
            - **Windows**: Portable ZIP (x86_64)
            
            ### Notas
            - Linux: `chmod +x Prisma-Linux-*.AppImage && ./Prisma-Linux-*.AppImage`
            - macOS: Clic derecho → Abrir (para bypass de Gatekeeper)
            - Windows: Descomprimir el archivo ZIP en cualquier carpeta o pendrive y ejecutar `prismlauncher.exe`
          files: |
            artifacts/**/*
