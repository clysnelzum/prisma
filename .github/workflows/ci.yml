name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Style Check
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check CMake format
        run: |
          pip install --quiet cmakelang
          find . -name CMakeLists.txt -not -path "./cmake/*" -not -path "./libraries/*" | head -20 | xargs cmake-format --check 2>&1 || echo "⚠️ Some CMake files need formatting"

      - name: Check trailing whitespace
        run: |
          ! git grep -I $'\t' -- '*.cpp' '*.h' '*.cmake' 'CMakeLists.txt' || echo "Tabs found in source files"

      - name: Check line endings
        run: |
          ! git grep -I $'\r' -- '*.cpp' '*.h' '*.cmake' 'CMakeLists.txt' || echo "CRLF line endings found"

  build-check:
    name: Build Check (Linux)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build extra-cmake-modules pkg-config ccache \
            libgl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-0 libxcb-cursor-dev \
            libxcb-xinerama0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-sync1 libxcb-xfixes0 libxcb-glx0

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: ci-linux-build
          max-size: 2G

      - name: Install Qt 6.8
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          modules: 'qtimageformats qtnetworkauth'
          cache: true
          install-deps: false

      - name: Cache vcpkg archives
        uses: actions/cache@v6
        with:
          path: ~/.cache/vcpkg/archives
          key: ${{ runner.os }}-vcpkg-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-

      - name: Bootstrap vcpkg
        run: |
          chmod +x cmake/vcpkg/bootstrap-vcpkg.sh
          ./cmake/vcpkg/bootstrap-vcpkg.sh -disableMetrics
          echo "VCPKG_ROOT=${{ github.workspace }}/cmake/vcpkg" >> $GITHUB_ENV

      - name: Configure CMake
        run: |
          cmake --preset linux \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_MAKE_PROGRAM=ninja \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DENABLE_LTO=OFF \
            -DBUILD_TESTING=OFF \
            -Wno-dev

      - name: Build
        run: cmake --build --preset linux --config Release --parallel
